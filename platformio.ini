[env:esp32-2432s028r]
platform = espressif32@6.12.0
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps = bodmer/TFT_eSPI@2.5.43
build_flags =
    -D USER_SETUP_LOADED
    -D ILI9341_DRIVER
    -D USE_HSPI_PORT
    -D TFT_MISO=12
    -D TFT_MOSI=13
    -D TFT_SCLK=14
    -D TFT_CS=15
    -D TFT_DC=2
    -D TFT_RST=-1
    -D LOAD_GLCD
    -D LOAD_FONT2
    -D SPI_FREQUENCY=40000000
